<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario-Aware Comparative Residential Regulation Index — V1.0 Pilot</title>
<style>
  :root{
    --bg:#f6f7f5; --panel:#ffffff; --ink:#1f2a24; --muted:#5a6b62; --line:#dde3de;
    --accent:#3c6e58; --accent-soft:#e6efe9; --warn-bg:#fdf3e3; --warn-border:#e3b35c;
    --confirmed:#3c6e58; --caveat:#b98900; --excluded:#9b5d4a; --na:#8c8c8c; --unresolved:#6a6fb0;
    --greenwich:#a3473c; --bridgeport:#355f8a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15191a; --panel:#1c2224; --ink:#e7ece8; --muted:#9fb0a7; --line:#30393a;
      --accent:#7fc9a6; --accent-soft:#213229; --warn-bg:#352c16; --warn-border:#8a6a2a;
      --confirmed:#7fc9a6; --caveat:#e0b84a; --excluded:#d79a86; --na:#9aa3a0; --unresolved:#a8aef0;
      --greenwich:#e0897c; --bridgeport:#8fb4de; }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  header{padding:20px 24px 0; max-width:1100px; margin:0 auto;}
  h1{font-size:22px; margin:0 0 2px;}
  h2.subtitle{font-size:14px; font-weight:500; color:var(--muted); margin:0 0 2px;}
  .version-tag{display:inline-block; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; margin:6px 0 14px;}
  .warning{background:var(--warn-bg); border:1px solid var(--warn-border); border-radius:10px; padding:12px 16px; font-size:13.5px; margin-bottom:14px;}
  nav{display:flex; flex-wrap:wrap; gap:4px; max-width:1100px; margin:0 auto; padding:0 24px; border-bottom:1px solid var(--line);}
  nav button{appearance:none; border:none; background:none; color:var(--muted); font-size:13.5px; font-weight:600; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent;}
  nav button.active{color:var(--accent); border-bottom-color:var(--accent);}
  nav button:hover{color:var(--ink);}
  main{max-width:1100px; margin:0 auto; padding:20px 24px 60px;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:16px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:760px){ .grid2{grid-template-columns:1fr;} }
  .stat{display:flex; flex-direction:column; gap:2px;}
  .stat .num{font-size:28px; font-weight:700;}
  .stat .lbl{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.02em;}
  select,input[type=range]{font:inherit; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink);}
  .pill{display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:700;}
  .pill.confirmed{background:var(--confirmed); color:#fff;}
  .pill.caveat{background:var(--caveat); color:#fff;}
  .pill.excluded{background:var(--excluded); color:#fff;}
  .pill.na{background:var(--na); color:#fff;}
  .pill.unresolved{background:var(--unresolved); color:#fff;}
  .bar-row{display:flex; align-items:center; gap:8px; margin:5px 0;}
  .bar-row .label{width:150px; font-size:12.5px; color:var(--muted); flex-shrink:0;}
  .bar-track{flex:1; height:16px; background:var(--accent-soft); border-radius:8px; overflow:hidden; position:relative;}
  .bar-fill{height:100%; border-radius:8px;}
  .bar-value{width:36px; text-align:right; font-size:12px; font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);}
  .small{font-size:12.5px;}
  .flex-between{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .btn{display:inline-block; background:var(--accent); color:#fff; padding:8px 14px; border-radius:8px; text-decoration:none; font-size:13px; font-weight:600;}
  .btn.secondary{background:var(--accent-soft); color:var(--accent);}
  .scenario-marker{position:absolute; top:-5px; width:2px; height:26px; background:var(--greenwich);}
  .hist-bar{fill:var(--bridgeport);}
  .caption{font-size:12px; color:var(--muted); margin-top:4px;}
  code{background:var(--accent-soft); padding:1px 5px; border-radius:4px; font-size:12px;}
  .loading{padding:40px; text-align:center; color:var(--muted);}
  .dl-list a{display:block; margin:4px 0;}
  details summary{cursor:pointer; font-weight:600; font-size:13.5px;}
</style>
</head>
<body>

<header>
  <h1 id="app-title">Scenario-Aware Comparative Residential Regulation Index</h1>
  <h2 class="subtitle" id="app-subtitle">Greenwich RA-4 and Bridgeport Residential Building-Form Scenarios</h2>
  <span class="version-tag" id="app-version">Version 1.0 — Source-Linked Pilot</span>
  <div class="warning" id="app-warning">Loading data…</div>
</header>

<nav id="tabs">
  <button data-tab="start" class="active">Start Here</button>
  <button data-tab="compare">Compare Scenarios</button>
  <button data-tab="distribution">Bridgeport Distribution</button>
  <button data-tab="sensitivity">Sensitivity</button>
  <button data-tab="evidence">Evidence Explorer</button>
  <button data-tab="excluded">Excluded Context</button>
  <button data-tab="methods">Methods and Limits</button>
  <button data-tab="download">Download / Audit</button>
</nav>

<main id="main"><div class="loading">Loading comparative_residential_regulation_index_v1 data…</div></main>

<script src="app.js"></script>
</body>
</html>
